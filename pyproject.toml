[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fish-flow"
version = "0.1.0"
description = "Physics-informed surface sensor flow reconstruction for 2D fish wake"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0,<2.6",
    "numpy>=1.24,<2.3",
    "scipy>=1.10",
    "h5py>=3.8",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
